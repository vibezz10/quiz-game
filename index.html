<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="quiz-container">
        <section class="quiz-card" aria-labelledby="quiz-title">
            <header class="quiz-header">
                <p class="eyebrow">Mini Project 10</p>
                <h1 id="quiz-title">JavaScript Quiz</h1>
                <div class="quiz-meta">
                    <span id="progress" aria-live="polite">Question 1 of 5</span>
                    <span id="score" aria-live="polite">Score: 0</span>
                </div>
                <div class="progress-track" aria-hidden="true">
                    <div id="progressBar" class="progress-bar"></div>
                </div>
            </header>

            <h2 id="question">Loading question…</h2>
            <div id="answers" class="answers" aria-label="Answer choices"></div>
            <p id="feedback" class="feedback" aria-live="polite"></p>

            <button id="nextButton" type="button" disabled>Check answer</button>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
